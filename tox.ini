[tox]
requires = tox>=4
env_list = py

[testenv]
description = Run the model and API test suite
deps =
    fastapi>=0.115,<1
    geopandas>=1.0,<2
    httpx>=0.27,<1
    mlflow>=2.12,<4
    numpy>=1.24,<3
    pandas>=2.2,<4
    pytest>=8.3,<9
    requests>=2.32,<3
    scikit-learn>=1.5,<2
    xgboost>=2.1,<4
setenv =
    PYTHONPATH = {toxinidir}
commands =
    pytest -q {posargs:tests}
